components:
  schemas:
    Avance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reto:
          type: integer
        fecha:
          type: string
          format: date
        descripcion:
          type: string
          maxLength: 255
        porcentaje:
          type: integer
          maximum: 100
          minimum: 0
        creado:
          type: string
          format: date-time
          readOnly: true
      required:
      - creado
      - descripcion
      - fecha
      - id
      - porcentaje
      - reto
    EstadoEnum:
      enum:
      - PENDIENTE
      - EN_CURSO
      - COMPLETADO
      type: string
      description: |-
        * `PENDIENTE` - Pendiente
        * `EN_CURSO` - En curso
        * `COMPLETADO` - Completado
    Microaccion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tarea:
          type: integer
        titulo:
          type: string
          maxLength: 160
        fecha_objetivo:
          type: string
          format: date
        minutos_estimados:
          type: integer
          maximum: 240
          minimum: 1
        completada:
          type: boolean
        creado:
          type: string
          format: date-time
          readOnly: true
        vencida:
          type: boolean
          readOnly: true
      required:
      - creado
      - fecha_objetivo
      - id
      - minutos_estimados
      - tarea
      - titulo
      - vencida
    PaginatedAvanceList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Avance'
    PaginatedRetoList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Reto'
    PatchedAvance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reto:
          type: integer
        fecha:
          type: string
          format: date
        descripcion:
          type: string
          maxLength: 255
        porcentaje:
          type: integer
          maximum: 100
          minimum: 0
        creado:
          type: string
          format: date-time
          readOnly: true
    PatchedMicroaccion:
      type: object
